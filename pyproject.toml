[project]
name = "fints-actual-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "cryptography>=42",
    "fints @ git+https://github.com/ArlindNocaj/python-fints.git@07abcb53be38b865d28027dd21cc51193f70da03",
    "psycopg[binary]",
    "httpx",
    "dj-database-url",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "factory-boy",
]

[tool.setuptools.packages.find]
include = ["config*", "domain*", "application*", "infrastructure*", "presentation*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
